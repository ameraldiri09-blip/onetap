<style>
:root {
  box-sizing: border-box;
  --bg: #070709;
  --card: rgba(20, 20, 25, 0.72);
  --card-solid: #141419;
  --card-hover: rgba(30, 30, 38, 0.88);
  --glass: rgba(14, 14, 18, 0.78);
  --tx: #f7f4f0;
  --mut: #9e968d;
  --ac: #ff7a1a;
  --ac2: #ffb347;
  --acg: linear-gradient(135deg, #ff9d47 0%, #ff6a00 100%);
  --acx: #120800;
  --gold: #ff9a4d;
  --glow: rgba(255, 122, 26, 0.18);
  --tint: rgba(255, 122, 26, 0.13);
  --bd: rgba(255, 255, 255, 0.08);
  --bd-hover: rgba(255, 154, 77, 0.45);
  --ok: #ffa15c;
  --sh: 0 14px 34px -10px rgba(0, 0, 0, 0.65);
  --grid-line: rgba(255, 122, 26, 0.045);
  --mx: 50vw;
  --my: 30vh;
}
:root[data-theme="light"] {
  --bg: #f7f5f0;
  --card: rgba(255, 255, 255, 0.82);
  --card-solid: #ffffff;
  --card-hover: rgba(255, 255, 255, 0.98);
  --glass: rgba(255, 255, 255, 0.85);
  --tx: #141312;
  --mut: #666059;
  --ac: #e05806;
  --ac2: #ff8533;
  --acg: linear-gradient(135deg, #ff802b 0%, #d95000 100%);
  --acx: #ffffff;
  --gold: #e66c12;
  --glow: rgba(255, 122, 26, 0.14);
  --tint: rgba(255, 122, 26, 0.11);
  --bd: rgba(0, 0, 0, 0.08);
  --bd-hover: rgba(224, 88, 6, 0.45);
  --ok: #d9560a;
  --sh: 0 12px 28px -8px rgba(0, 0, 0, 0.09);
  --grid-line: rgba(224, 88, 6, 0.055);
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  scroll-behavior: smooth;
}
*, *:before, *:after {
  box-sizing: inherit;
}
body {
  margin: 0;
  background-color: var(--bg);
  color: var(--tx);
  font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  line-height: 1.5;
  padding-top: 120px;
  padding-bottom: 48px;
  overflow-x: hidden;
  position: relative;
  transition: padding .25s, background-color .3s, color .2s;
}
body.has-sel {
  padding-bottom: 120px;
}

/* ===== الخلفية المتحركة ===== */
.bg-fx {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}
.bg-grid {
  position: absolute;
  inset: -100px;
  background-image: 
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 46px 46px;
  mask-image: radial-gradient(ellipse 80% 65% at 50% 35%, #000 35%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 80% 65% at 50% 35%, #000 35%, transparent 100%);
  animation: gridPan 22s linear infinite;
}
@keyframes gridPan {
  0% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(46px, 46px, 0); }
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(85px);
  opacity: 0.55;
  will-change: transform;
}
.orb-1 {
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, rgba(255, 122, 26, 0.35), transparent 70%);
  top: -160px;
  left: 12%;
  animation: floatOrb1 18s ease-in-out infinite alternate;
}
.orb-2 {
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(255, 175, 64, 0.25), transparent 70%);
  top: 25%;
  right: -120px;
  animation: floatOrb2 24s ease-in-out infinite alternate;
}
.orb-3 {
  width: 520px;
  height: 520px;
  background: radial-gradient(circle, rgba(242, 85, 10, 0.2), transparent 70%);
  bottom: -180px;
  left: -100px;
  animation: floatOrb3 20s ease-in-out infinite alternate;
}
@keyframes floatOrb1 {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(110px, 80px) scale(1.18); }
}
@keyframes floatOrb2 {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-130px, 110px) scale(1.15); }
}
@keyframes floatOrb3 {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(120px, -90px) scale(1.2); }
}

.cursor-glow {
  position: absolute;
  width: 650px;
  height: 650px;
  left: var(--mx);
  top: var(--my);
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255, 122, 26, 0.09), transparent 65%);
  border-radius: 50%;
  pointer-events: none;
  transition: left 0.08s linear, top 0.08s linear;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}
.wrap {
  max-width: 1020px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ===== الشريط العلوي ===== */
.top {
  position: fixed;
  top: 0;
  inset-inline: 0;
  z-index: 20;
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid var(--bd);
  box-shadow: 0 4px 30px rgba(0,0,0,.18);
  padding-top: env(safe-area-inset-top, 0px);
}
.top::after {
  content: "";
  position: absolute;
  bottom: -1px;
  inset-inline: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--ac), var(--ac2), var(--ac), transparent);
  background-size: 200% 100%;
  animation: shimmerLine 6s linear infinite;
}
@keyframes shimmerLine {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0 8px;
}
.wm {
  height: 28px;
  width: auto;
  display: block;
  overflow: visible;
  filter: drop-shadow(0 2px 10px rgba(255,122,26,.22));
}
.wm path, .wm circle, .wm ellipse {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.w1 { stroke: var(--tx); }
.w2 { stroke: var(--gold); }
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.acts {
  display: flex;
  gap: 8px;
}
#lang, #theme {
  height: 38px;
  border: 1px solid var(--bd);
  background: var(--card);
  border-radius: 11px;
  color: var(--tx);
  transition: all .18s ease;
}
#lang:hover, #theme:hover {
  border-color: var(--ac);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px var(--tint);
}
#lang {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  font-weight: 700;
  font-size: .8rem;
}
#theme {
  width: 38px;
  display: grid;
  place-items: center;
}

.tl {
  display: flex;
  gap: 10px;
  padding: 0 0 11px;
  align-items: center;
}
.seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 12px;
}
.seg button {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  border: 0;
  background: transparent;
  border-radius: 9px;
  color: var(--mut);
  font-size: .88rem;
  font-weight: 500;
  transition: all .2s cubic-bezier(.2,.8,.2,1);
}
.seg button svg {
  width: 15px;
  height: 15px;
}
.seg button.on {
  background: var(--acg);
  color: var(--acx);
  font-weight: 700;
  box-shadow: 0 3px 12px rgba(255, 122, 26, .35);
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
}
.search-wrap .s-ic {
  position: absolute;
  inset-inline-start: 13px;
  color: var(--mut);
  pointer-events: none;
  width: 16px;
  height: 16px;
  transition: color .2s;
}
#q {
  width: 100%;
  padding: 9px 36px 9px 38px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  background: var(--bg);
  color: var(--tx);
  font: inherit;
  font-size: .92rem;
  transition: all .2s;
}
#q:focus {
  border-color: var(--ac);
  box-shadow: 0 0 0 3.5px var(--tint);
  outline: none;
}
.search-wrap:focus-within .s-ic {
  color: var(--ac);
}
#qclr {
  position: absolute;
  inset-inline-end: 7px;
  width: 24px;
  height: 24px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--mut);
  display: none;
  place-items: center;
  font-size: 1.1rem;
  line-height: 1;
}
#qclr.show {
  display: grid;
}
#qclr:hover {
  color: var(--tx);
  background: var(--card);
}

/* ===== القسم الترحيبي ===== */
.intro {
  padding: 28px 4px 12px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 13px;
  border-radius: 99px;
  background: var(--tint);
  border: 1px solid rgba(255, 122, 26, .28);
  color: var(--ac);
  font-size: .78rem;
  font-weight: 700;
  margin-bottom: 12px;
  box-shadow: 0 0 20px rgba(255, 122, 26, .12);
}
.hero-badge .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ac);
  box-shadow: 0 0 8px var(--ac);
  animation: pulseDot 1.8s infinite;
}
@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.5; }
}
.intro h1 {
  margin: 0 0 10px;
  font-size: clamp(1.65rem, 4vw, 2.35rem);
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -.015em;
  background: linear-gradient(135deg, var(--tx) 30%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.intro p {
  margin: 0;
  color: var(--mut);
  max-width: 600px;
  font-size: 1rem;
}
.intro p b {
  color: var(--ac);
}
.lnk {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 14px;
  padding: 8px 16px;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 99px;
  color: var(--tx);
  font-weight: 600;
  font-size: .86rem;
  text-decoration: none;
  backdrop-filter: blur(10px);
  transition: all .2s ease;
}
.lnk svg {
  color: var(--ac);
}
.lnk:hover {
  border-color: var(--ac);
  color: var(--ac);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255,122,26,.18);
}

/* ===== الأقسام والمجموعات ===== */
.tools {
  padding: 16px 0 0;
}
.chips {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 6px 2px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar, .packs::-webkit-scrollbar {
  display: none;
}
.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--bd);
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 99px;
  font-size: .85rem;
  white-space: nowrap;
  color: var(--mut);
  transition: all .18s ease;
}
.chip:hover {
  border-color: var(--bd-hover);
  color: var(--tx);
  transform: translateY(-1px);
}
.chip b {
  font-size: .72rem;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--bg);
  color: var(--mut);
}
.chip.on {
  background: var(--acg);
  color: var(--acx);
  border-color: transparent;
  font-weight: 700;
  box-shadow: 0 4px 14px rgba(255, 122, 26, .3);
}
.chip.on b {
  background: rgba(0, 0, 0, 0.22);
  color: #fff;
}

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 26px 2px 11px;
}
h3 {
  margin: 26px 2px 11px;
  font-size: .88rem;
  font-weight: 700;
  color: var(--mut);
  letter-spacing: .01em;
  display: flex;
  align-items: center;
  gap: 8px;
}
h3::before {
  content: "";
  width: 4px;
  height: 15px;
  border-radius: 4px;
  background: var(--acg);
  display: inline-block;
}
.sec-head h3 {
  margin: 0;
}
.sec-tog {
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--ac);
  font-size: .77rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 99px;
  transition: all .15s;
}
.sec-tog:hover {
  border-color: var(--ac);
  background: var(--tint);
}

.packs {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 2px 2px 6px;
  scrollbar-width: none;
}
.pack {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 15px;
  border-radius: 12px;
  border: 1px solid var(--bd);
  background: var(--card);
  backdrop-filter: blur(10px);
  font-size: .87rem;
  font-weight: 600;
  transition: all .18s ease;
}
.pack small {
  color: var(--mut);
  font-size: .73rem;
  background: var(--bg);
  padding: 1px 7px;
  border-radius: 99px;
}
.pack:hover {
  border-color: var(--ac);
  color: var(--acx);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,.2);
}
.pack.on {
  border-color: var(--ac);
  background: var(--tint);
  color: var(--ac);
  box-shadow: 0 0 18px rgba(255,122,26,.2);
}
.pack.on small {
  background: var(--ac);
  color: var(--acx);
}

/* ===== شبكة البطاقات ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 11px;
}
.card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 13px;
  border: 1px solid var(--bd);
  border-radius: 15px;
  background: var(--card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  text-align: start;
  position: relative;
  min-width: 0;
  overflow: hidden;
  transition: transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255, 122, 26, 0.12), transparent 60%);
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
}
.card:hover:not(:disabled) {
  border-color: var(--bd-hover);
  background: var(--card-hover);
  transform: translateY(-3px);
  box-shadow: var(--sh);
}
.card:hover::before {
  opacity: 1;
}
.card:active:not(:disabled) {
  transform: translateY(-1px) scale(0.99);
}

.card .av {
  position: relative;
  overflow: hidden;
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--tint);
  color: var(--ac);
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 4px 10px rgba(0,0,0,.2);
  transition: transform .2s ease;
}
.card:hover .av {
  transform: scale(1.06);
}
.card.on {
  border-color: var(--ac);
  background: linear-gradient(145deg, var(--tint), var(--card));
  box-shadow: 0 8px 24px -8px rgba(255, 122, 26, 0.4), inset 0 0 0 1px rgba(255, 122, 26, 0.35);
}
.card.on .av {
  background: var(--ac);
  color: var(--acx);
}
.av i {
  font-style: normal;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
}
.av i svg {
  width: 56%;
  height: 56%;
}

.card.on::after {
  content: "";
  position: absolute;
  top: 9px;
  inset-inline-end: 10px;
  width: 6px;
  height: 10px;
  border: solid var(--ac);
  border-width: 0 2.4px 2.4px 0;
  transform: rotate(45deg);
  animation: checkPop .2s cubic-bezier(.2,1.3,.4,1);
}
@keyframes checkPop {
  0% { transform: scale(0) rotate(45deg); }
  100% { transform: scale(1) rotate(45deg); }
}

.card .nm {
  flex: 1;
  min-width: 0;
  white-space: normal;
  overflow: visible;
  padding-inline-end: 12px;
}
.card .nm .t {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: .92rem;
  font-weight: 700;
}
.tn {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.pp {
  flex: none;
  font-size: .62rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--tint);
  color: var(--ac);
  border: 1px solid rgba(255,122,26,.25);
}
.card.on .pp {
  background: var(--card-solid);
}
.card .nm small {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--mut);
  font-size: .74rem;
  line-height: 1.38;
  margin-top: 3px;
}

/* ===== الأدوات والأزرار ===== */
.add {
  display: flex;
  gap: 8px;
}
.add input {
  flex: 1;
  min-width: 0;
  padding: 11px 15px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  background: var(--card);
  backdrop-filter: blur(10px);
  color: var(--tx);
  font: inherit;
  direction: ltr;
  transition: border-color .2s;
}
.add input:focus {
  border-color: var(--ac);
  outline: none;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 11px 18px;
  border-radius: 12px;
  border: 1px solid var(--bd);
  background: var(--card);
  backdrop-filter: blur(10px);
  font-weight: 600;
  transition: all .18s ease;
}
.btn:hover {
  border-color: var(--bd-hover);
  background: var(--card-hover);
  transform: translateY(-1px);
}
.btn.pri {

  border-radius: 6px;
  font-size: .84em;
  color: var(--gold);
}
.tk {

}
.foot {

  padding: 28px 0 12px;

  text-align: center;
  color: var(--mut);
  font-size: .85rem;
}

}

}

/* ===== الشريط السفلي ===== */
.bar {
  position: fixed;
  inset-inline: 0;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 19;
  pointer-events: none;
  transform: translateY(140%);
  visibility: hidden;
  transition: transform .3s cubic-bezier(.2, .9, .2, 1), visibility 0s .3s;
}
.bar.show {
  transform: none;
  visibility: visible;
  transition-delay: 0s;
}
.bar .dock {
  pointer-events: auto;
  max-width: 620px;
  margin: 0 auto;
  padding: 10px 14px;
  background: var(--glass);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--bd-hover);
  border-radius: 18px;
  box-shadow: 0 15px 40px rgba(0,0,0,.45), 0 0 25px rgba(255, 122, 26, .18);
  display: flex;
  gap: 10px;
  align-items: center;
}
.cnt {
  margin-inline-end: auto;
  font-weight: 700;
  font-size: .95rem;
  padding-inline-start: 6px;
}

dialog {
  width: min(580px, 94vw);
  border: 1px solid var(--bd-hover);
  border-radius: 20px;
  background: var(--card-solid);
  color: var(--tx);
  padding: 22px;
  box-shadow: 0 25px 70px rgba(0,0,0,.65);
}
dialog::backdrop {
  background: rgba(0, 0, 0, .68);
  backdrop-filter: blur(6px);
}
dialog strong {
  font-size: 1.1rem;
}
.dlg-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
textarea {
  width: 100%;
  height: 165px;
  direction: ltr;
  text-align: left;
  font: 12.5px/1.55 ui-monospace, Menlo, Consolas, monospace;
  background: var(--bg);
  color: var(--tx);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 12px;
  resize: vertical;
  margin: 10px 0 8px;
}
.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.row .btn {
  flex: 1;
  min-width: 130px;
}
ol {
  padding-inline-start: 20px;
  color: var(--mut);
  font-size: .86rem;
  margin: 10px 0 0;
  line-height: 1.65;
}
#msg {
  color: var(--ok);
  min-height: 1.3em;
  font-size: .88rem;
  font-weight: 600;
  margin-top: 6px;
}
.empty {
  text-align: center;
  color: var(--mut);
  padding: 46px 16px;
  border: 1px dashed var(--bd);
  border-radius: 16px;
  margin-top: 16px;
  background: var(--card);
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 96px;
  transform: translate(-50%, 20px);
  background: var(--tx);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 12px;
  font-size: .88rem;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: .22s;
  z-index: 30;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
#toast.on {
  opacity: 1;
  transform: translate(-50%, 0);
}
.dm {
  margin: 12px 0 0;
}
.gs {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}
.gn {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--acg);
  color: var(--acx);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: .85rem;
}
.gb2 {
  flex: 1;
  min-width: 0;
}
.gb2 p {
  margin: 2px 0 8px;
  font-size: .93rem;
  line-height: 1.55;
}
.gi text {
  direction: ltr;
  unicode-bidi: isolate;
  text-anchor: start;
}
.gi {
  direction: ltr;
  unicode-bidi: isolate;
  width: 100%;
  max-width: 320px;
  height: auto;
  display: block;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 12px;
}
dialog.sheet {
  max-height: 90vh;
  overflow: auto;
  width: 100%;
  max-width: 520px;
  margin: auto auto 0;
  border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
}
@media(min-width: 600px) {
  dialog.sheet {
    margin: auto;
    border-radius: 20px;
  }
}
.lo {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  margin-top: 8px;
  padding: 0 16px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  background: var(--bg);
  font-size: 1rem;
  text-align: start;
}
.lo span { flex: 1; }
.lo small { color: var(--mut); font-size: .75rem; }
.lo.on {

.lo.on:after {
  content: "";

  height: 11px;
  border: solid var(--ac);
  border-width: 0 2px 2px 0;

  margin-inline-start: 4px;
}

T.ar.psb="نسخ الأمر";T.ar.stp="<li>افتح PowerShell (ابحث عنه في قائمة ابدأ)</li><li>الصق الأمر (Ctrl+V) ثم اضغط Enter</li><li>يتطلب winget وهو مدمج في ويندوز 10/11</li>";T.ar.sec="ملاحظة: عند تنزيل ملف .bat قد يظهر تنبيه SmartScreen اعتيادي من المتصفح. لتجنّبه يمكنك استخدام خيار «نسخ الأمر» ولصقه مباشرة في PowerShell.";
T.en.psb="Copy command";T.en.stp="<li>Open PowerShell (search for it in the Start menu)</li><li>Paste the command (Ctrl+V) and press Enter</li><li>Requires winget, included in Windows 10/11</li>";T.en.sec="Note: Downloading a .bat file may trigger a standard browser SmartScreen warning. You can avoid it by using 'Copy command' directly in PowerShell.";
T.tr.psb="Komutu kopyala";T.tr.stp="<li>PowerShell'i aç (Başlat menüsünde ara)</li><li>Komutu yapıştır (Ctrl+V) ve Enter'a bas</li><li>Windows 10/11'de bulunan winget gerekir</li>";T.tr.sec="Dosyayı indirirken tarayıcının veya Windows SmartScreen'in uyarı vermesi normaldir. Komutu PowerShell'e kopyalayarak bundan kaçınabilirsin.";
T.fr.psb="Copier la commande";T.fr.stp="<li>Ouvrez PowerShell (cherchez-le dans le menu Démarrer)</li><li>Collez la commande (Ctrl+V) puis appuyez sur Entrée</li><li>Nécessite winget, inclus dans Windows 10/11</li>";T.fr.sec="Un avertissement SmartScreen au téléchargement du .bat est normal. Évitez-le en copiant la commande dans PowerShell.";
T.es.psb="Copiar comando";T.es.stp="<li>Abre PowerShell (búscalo en el menú Inicio)</li><li>Pega el comando (Ctrl+V) y pulsa Enter</li><li>Requiere winget, incluido en Windows 10/11</li>";T.es.sec="Un aviso de SmartScreen al descargar el .bat es normal. Evítalo copiando el comando directamente en PowerShell.";
